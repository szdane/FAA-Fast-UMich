# ============================================================
# Pre-TRACON transit time analysis configuration
# All waypoints are given as [lat, lon].
#
# Base settings below apply to every run. Optional [[scenarios]]
# blocks at the bottom each override a subset of settings; the
# script runs ALL scenarios in one pass (IFF files are read once
# per day, shared across scenarios). If no [[scenarios]] blocks
# are present, the base settings run as a single scenario.
# ============================================================
name = "DTW north flow"

[paths]
data_dir = "/Users/anomi/Documents/LATTICE/FAST/CSV/SHERLOCK_data/2023_ARTCC_datasets/IFF_RD_ZOB_2023_12_01_2024_01_01"
output_dir = "/Users/anomi/Documents/LATTICE/FAST/Figures/pre-TRACON_transit_time/ZOB_figures/north_flow"
csv_output_dir = "/Users/anomi/Documents/LATTICE/FAST/CSV/pre-TRACON_transit_times/ZOB/north_flow"

[region]
# Center of the pre-TRACON circle (usually the arrival airport)
center_lat = 42.2122
center_lon = -83.3540
radius_km = 300.0
# A trajectory is "full" if it starts within this distance of the outer
# circle AND ends within this distance of the TRACON boundary.
boundary_tolerance_km = 10.0
# Ring order of the TRACON boundary (names must exist in [region.star_fixes])
ordered_fixes = ["CUUGR", "KLYNK", "VCTRZ", "LECTR", "HTROD", "KKISS", "LAYKS"]

[region.star_fixes]
CUUGR = [42.3643, -83.0975]
KLYNK = [41.8793, -82.9888]
VCTRZ = [41.9878, -84.0670]
LECTR = [41.9183, -84.0217]
HTROD = [42.0278, -83.3442]
KKISS = [42.5443, -83.7620]
LAYKS = [42.8532, -83.5498]

[rd_filters]
# Keep flights whose Dest (col 26) is any of these
dest_airports = ["KDTW"]
# Keep ONLY flights whose Airline (col 21) starts with any of these
# prefixes. Use [] to keep all airlines.
include_airline_prefixes = []
# Drop flights whose Airline starts with any of these prefixes
exclude_airline_prefixes = ["GA."]
# Keep flights whose landing runway (col 28) starts with any of these
# prefixes. Use [] to disable the runway filter entirely.
landing_runway_prefixes = ["21", "22"]
# Drop flights whose landing runway is unknown ("?", "NONE", or empty),
# regardless of the prefix filter above.
exclude_unknown_runway = true

[processing]
chunksize = 500000

# ============================================================
# SCENARIOS - each block overrides base settings.
# Allowed keys: name, data_dir, output_dir, csv_output_dir,
# center_lat, center_lon, ordered_fixes, star_fixes, dest_airports,
# include_airline_prefixes, exclude_airline_prefixes,
# landing_runway_prefixes, exclude_unknown_runway
#
# Notes:
# - If a scenario provides star_fixes, it REPLACES the base set entirely
#   (define it as [scenarios.star_fixes] INSIDE the scenario block, and
#   provide a matching ordered_fixes list).
# - Scenarios sharing the same data_dir and region run in one shared
#   data pass; a different data_dir or region gets its own pass.
# ============================================================


[[scenarios]]
name = "ORD"
data_dir = "/Users/anomi/Documents/LATTICE/FAST/CSV/SHERLOCK_data/2023_ARTCC_datasets/IFF_RD_ZAU_2023_12_01_2024_01_01"
